services:
  postgres:
    image: postgres:16-alpine
    container_name: nuhiris-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: nuhiris_db
      POSTGRES_USER: nuhiris_app
      POSTGRES_PASSWORD: changeme_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nuhiris_app -d nuhiris_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nuhiris-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nuhiris-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: nuhiris-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/nuhiris-documents;
      mc anonymous set none local/nuhiris-documents;
      echo 'Bucket nuhiris-documents created';
      "

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: nuhiris-keycloak
    ports:
      - '8080:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
      KC_HEALTH_ENABLED: true
    command: start-dev --import-realm
    volumes:
      - ./infra/docker/keycloak/realm-export.json:/opt/keycloak/data/import/nuhiris-realm.json
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/8080']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nuhiris-api
    ports:
      - '3002:3000'
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nuhiris_db
      DATABASE_USER: nuhiris_app
      DATABASE_PASSWORD: changeme_dev_only
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: nuhiris
      KEYCLOAK_CLIENT_ID: nuhiris-api
      KEYCLOAK_CLIENT_SECRET: changeme_dev_only
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: nuhiris-documents
      MINIO_USE_SSL: false
      JWT_PUBLIC_KEY_URL: http://keycloak:8080/realms/nuhiris/protocol/openid-connect/certs
      JWT_DEV_SECRET: nuhiris-dev-secret-do-not-use-in-production
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      HMAC_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      USE_REAL_NIMC: false
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
    container_name: nuhiris-web
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
