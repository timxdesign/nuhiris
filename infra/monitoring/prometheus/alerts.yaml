groups:
  - name: nuhiris-api
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on NUHIRIS API"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatency
        expr: http_request_duration_seconds_sum / http_request_duration_seconds_count > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "Average response time is {{ $value }}s"

      - alert: APIDown
        expr: up{job="nuhiris-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NUHIRIS API instance is down"

      - alert: HighMemoryUsage
        expr: container_memory_working_set_bytes{container="api"} / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API container memory usage above 85%"

  - name: database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

      - alert: HighConnectionCount
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count is high ({{ $value }})"

      - alert: LowDiskSpace
        expr: pg_database_size_bytes / (50 * 1024 * 1024 * 1024) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Database using > 80% of allocated storage"

  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 90%"

  - name: security
    rules:
      - alert: HighAuthFailureRate
        expr: rate(http_requests_total{path="/auth/login",status="401"}[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate — possible brute force"

      - alert: AuditWriteFailure
        expr: rate(http_requests_total{path=~"/audit.*",status="500"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audit log write failures detected — compliance risk"
