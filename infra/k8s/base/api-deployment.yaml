apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuhiris-api
  namespace: nuhiris
  labels:
    app: nuhiris-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nuhiris-api
  template:
    metadata:
      labels:
        app: nuhiris-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nuhiris-api
      containers:
        - name: api
          image: nuhiris/api:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: nuhiris-api-config
            - secretRef:
                name: nuhiris-api-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: nuhiris-api
  namespace: nuhiris
spec:
  selector:
    app: nuhiris-api
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nuhiris-api
  namespace: nuhiris
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "nuhiris-api"
