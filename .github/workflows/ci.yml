name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint type-check

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nuhiris_test
          POSTGRES_USER: nuhiris_app
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuhiris_app -d nuhiris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: nuhiris_test
      DATABASE_USER: nuhiris_app
      DATABASE_PASSWORD: testpass
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      HMAC_KEY: 'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
      JWT_PUBLIC_KEY_URL: 'http://localhost:8080/realms/nuhiris/protocol/openid-connect/certs'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Unit tests
        run: pnpm --filter @nuhiris/api test:unit

      - name: Unit tests (coverage)
        run: pnpm --filter @nuhiris/api test:coverage
        continue-on-error: true

  test-packages:
    name: Package Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & test shared packages
        run: |
          pnpm turbo run build --filter='./packages/*'
          pnpm --filter @nuhiris/crypto-utils test:unit
          pnpm --filter @nuhiris/fhir-utils test:unit

  test-web:
    name: Web Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Type check web
        run: pnpm --filter @nuhiris/web type-check

      - name: Build web
        run: pnpm --filter @nuhiris/web build

  build:
    name: Full Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test-api, test-packages, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
